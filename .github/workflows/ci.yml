name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/generated/v1.ts
      - run: npm run check
      - run: npm run test -- --run

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- ../docs/contracts/openapi-v1.json
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  browser-e2e:
    name: Browser end-to-end checks
    runs-on: ubuntu-latest
    env:
      NOSH_JWT_SECRET: ci-only-local-nosh-jwt-secret-key-2026
      NOSH_SEED_ADMIN_PASSWORD: ci-only-local-admin-password
      NOSH_E2E_ADMIN_EMAIL: manager@nosh.example
      NOSH_E2E_ADMIN_PASSWORD: ci-only-local-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: docker compose up --build --detach --wait
      - run: docker compose exec -T backend uv run python -m app.commands.seed
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --remove-orphans
