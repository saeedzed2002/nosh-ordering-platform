name: nosh

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nosh}
      POSTGRES_USER: ${POSTGRES_USER:-nosh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosh_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nosh} -d ${POSTGRES_DB:-nosh}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      NOSH_ENVIRONMENT: development
      NOSH_DATABASE_URL: postgresql://${POSTGRES_USER:-nosh}:${POSTGRES_PASSWORD:-nosh_local_password}@postgres:5432/${POSTGRES_DB:-nosh}
      NOSH_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      NOSH_MEDIA_ROOT: /var/lib/nosh-media
      NOSH_CONTRACT_SNAPSHOT: /docs/contracts/openapi-v1.json
      NOSH_JWT_SECRET: ${NOSH_JWT_SECRET:?Set NOSH_JWT_SECRET in .env before starting the backend}
      NOSH_SEED_ADMIN_PASSWORD: ${NOSH_SEED_ADMIN_PASSWORD:?Set NOSH_SEED_ADMIN_PASSWORD in .env before seeding}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
      - backend-venv:/app/.venv
      - media-data:/var/lib/nosh-media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  backend-venv:
  frontend-node-modules:
  postgres-data:
  media-data:
